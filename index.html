<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"c

    <title>Pantanal Paulista | Turismo e Natureza</title>

            <nav class="menu-principal" aria-label="Navegação principal">

                            </span>

                            <span class="menu-principal__texto">

                            </span>
                        </a>
                    </li>

                    <li class="menu-principal__item">
                        <a href="#cidades" class="menu-principal__link">
                            <span class="material-symbols-rounded menu-principal__icone" aria-hidden="true">

                    <li class="menu-principal__item">

                            </span>

                            </span>
                        </a>
                    </li>

                    <li class="menu-principal__item">
                        <a href="#contato" class="menu-principal__link">
                            <span class="material-symbols-rounded menu-principal__icone" aria-hidden="true">
                                mail

                            <span class="menu-principal__texto">
                                Contato
                            </span>
                        </a>

                </ul>
            </nav>

        </div>

    <main>

                <p class="hero__rotulo">
                    Região Turística Pantanal Paulista

                <h1 class="hero__titulo">
                    Pesca esportiva, natureza e aventura no coração do interior paulista.
                </h1>

                <a href="#cidades" class="hero__botao">
                    Veja as cidades
                </a>

        <section id="cidades">
            <!-- Pedro Luis -->

        <!-- Kauê -->
